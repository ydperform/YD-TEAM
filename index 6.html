<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YDPERFORM</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YDPERFORM"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0d0d0d">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--red:#7a0f1a;--white:#fff;--black:#0d0d0d;--soft:#f3eeee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--red);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{background:var(--black);padding:12px 16px}
h1{font-size:22px;margin:0;letter-spacing:.14em;font-weight:800}
h1 span{color:#d3303c}
#tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
#tabs button{background:#232323}
#tabs button.w{background:#fff;color:var(--red)}
main{max-width:860px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
button,select,input,textarea{font:inherit}
button{background:var(--black);color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
button.w{background:#fff;color:var(--red);font-weight:700}
button.on{background:var(--red);color:#fff}
button.x{background:transparent;color:#a33;padding:4px 8px}
select{background:#fff;color:var(--black);border:1px solid #bbb;border-radius:8px;padding:8px}
.card{background:#fff;color:var(--black);border-radius:12px;padding:14px;margin-bottom:12px}
.head{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin:8px 0 3px}
input,textarea{width:100%;border:1px solid #c9c0c0;border-radius:8px;padding:8px;background:var(--soft);color:var(--black)}
textarea{min-height:56px;resize:vertical}
small{color:#555}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tempo{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tempo input{text-align:center;padding:8px 2px}
.ex-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--red);padding-bottom:6px;margin-bottom:4px}
.ex-top b{color:var(--red)}
.eff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.v{display:inline-block;margin-top:6px;background:var(--red);color:#fff;padding:7px 12px;border-radius:8px;text-decoration:none;font-size:14px}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.empty{text-align:center;padding:30px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{font-size:11px;text-align:center;color:var(--red);font-weight:700}
.day{min-height:62px;background:var(--soft);border-radius:6px;padding:3px;font-size:12px;cursor:pointer;overflow:hidden}
.day.td{outline:2px solid var(--red)}
.day.sel{background:#e8cfd1}
.day i{display:block;font-style:normal;font-size:10px;border:1px solid var(--red);border-radius:4px;padding:0 2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day i.dn{background:var(--red);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:14px 0 6px}
.hab{display:flex;gap:8px;align-items:center;border-left:4px solid var(--red);background:var(--soft);border-radius:8px;padding:8px;margin-bottom:6px}
.hab.ok{background:#ead7d9}
.yn{display:flex;gap:3px}
.num{display:flex;align-items:center;gap:4px}
.num input{width:72px;text-align:right}
.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.ten button{padding:9px 0;background:#d8d2d2;color:var(--black)}
.ten button.on{background:var(--red);color:#fff}
.dots{display:flex;justify-content:space-between;margin-top:8px;text-align:center}
.dot{display:block;width:30px;height:30px;line-height:30px;border-radius:50%;background:#ddd;color:#fff;margin-top:3px}
.dot.on{background:var(--red)}
.big{font-size:40px;font-weight:800;color:var(--red)}
.pb{height:5px;background:#ddd;border-radius:3px;margin:4px 0}
.pb i{display:block;height:100%;background:var(--red);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px;border-bottom:1px solid #ddd;text-align:left}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.charts .card{margin:0}.ex{font-size:12px;color:#555;margin-top:4px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0,#8c111f,#5a0a13 75%) fixed}
h1,.big,.cat,.hh,.sec,.tile b,.ex-top b{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:30px;letter-spacing:.2em}
header{border-bottom:3px solid #7a0f1a;padding-bottom:0}
#tabs button{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.1em;font-size:14px;border-radius:0;background:#000;color:#aaa;border-bottom:3px solid transparent;padding:10px 12px}
#tabs button.w{background:#000;color:#fff;border-bottom-color:#c4242f}
.card{border-radius:2px;border-top:4px solid #000}
button,input,select,textarea{border-radius:2px}
button{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600}
label{letter-spacing:.12em}
.script{font-family:"Pinyon Script","Snell Roundhand",cursive;text-transform:none;letter-spacing:0;font-weight:400}
.sec{font-size:34px;color:#fff;margin:24px 0 10px;line-height:1}
.sec .script{font-size:40px;margin-left:6px}
.hero{background:#000;border-left:8px solid #fff;padding:22px 18px;margin-bottom:12px}
.hh{font-size:clamp(44px,13vw,84px);line-height:.95;color:#fff}
.hero .script{font-size:clamp(30px,8vw,50px);color:#e8c9cc;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.tile{border:1px solid #000;padding:8px;text-align:center}
.tile b{font-size:28px;display:block;color:var(--red)}
.card>b:first-child,.card>.row:first-child>b:first-child{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:17px}
header{padding:12px 16px;border-bottom:0}
h1{font-size:26px}
#who button{background:#232323;padding:7px 12px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mt{display:flex;flex-direction:column;justify-content:space-between;gap:26px;text-align:left;min-height:140px;padding:16px;background:#fff;color:#0d0d0d;border:0;border-top:4px solid #000;border-radius:2px;text-transform:none;letter-spacing:0;font-weight:400}
.mt i{font-style:normal;font-size:11px;letter-spacing:.2em;color:#999}
.mt span{display:block}
.mt b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:var(--red);line-height:1}
.mt small{display:block;margin-top:6px;font-size:13px;color:#555}
.mt:active{background:#000}.mt:active b,.mt:active small{color:#fff}
.mt.wide{grid-column:1/-1;min-height:92px}
.ex-s{cursor:pointer;padding:12px 14px}
.ss{border-left:6px solid var(--red)}
table input{padding:6px 2px;text-align:center}
</style>
</head>
<body>
<header><div class="row"><h1>YD<span>PERFORM</span></h1><div><small id="st" style="color:#aaa;margin-right:8px"></small><span id="who"></span></div></div></header>
<main><div id="app"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let KEY="entrenos_v1";const $=id=>document.getElementById(id);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=ymd(new Date()),pf=v=>parseFloat(v)||0,uid=()=>Math.random().toString(36).slice(2,9);
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const DH=[["s1","Sueño","Sin pantallas antes de dormir","Sin dispositivos 1 h antes de acostarse","yn","",1],["s2","Sueño","Habitación oscura y fresca","Temperatura < 19 °C, sin luz","yn"],["s3","Sueño","Sin cafeína por la tarde","Nada de cafeína después de las 16:00","yn"],["r1","Recuperación","Estiramientos / movilidad","Sesión de flexibilidad y movilidad","num","min"],["h1","Hidratación & Nutrición","Hidratación diaria","Litros de agua consumidos","num","L"],["h2","Hidratación & Nutrición","Vaso de agua al despertar","Rehidratación tras la noche","yn"],["u1","Suplementación","Creatina","Monohidrato de creatina","num","g"],["u2","Suplementación","Magnesio","Glicinato, malato u otra forma","num","mg"],["m1","Mis hábitos","Sin lácteos","","yn"]].map(a=>({id:a[0],cat:a[1],name:a[2],desc:a[3],type:a[4],unit:a[5]||"",time:!!a[6]}));
let S={sessions:[],cur:null,rec:{},habits:null};
let USER="";
if(!S.habits)S.habits=DH;
S.sessions.forEach(s=>{if(s.rpe==null)s.rpe="";if(s.done==null)s.done=false});
if(!S.cur&&S.sessions[0])S.cur=S.sessions[0].id;
let et="",tp="",rs="",pg="",rt={},openEx=new Set();let entV="home",rng=30,tab="menu",cm=new Date(),selDay=today,rd=today,metric="load",per="d";
function save(){if(!USER||!CL)return;push()}
const cur=()=>S.sessions.find(s=>s.id===S.cur);
const R=()=>S.rec[rd]||(S.rec[rd]={h:{},ci:{h:7,q:5,m:5,f:3,d:3,c:""}});
const stats=s=>({m:pf(s.total),load:pf(s.total)*pf(s.rpe),vol:s.ex.reduce((a,e)=>a+pf(e.series)*pf(e.reps)*pf(e.load),0)});
const newEx=()=>({id:uid(),video:"",name:"",obs:"",material:"",series:"",reps:"",rest:"",t:["","","",""],effType:"RPE",effVal:"",load:""});
function newSession(date){const s={id:uid(),name:(ET.find(x=>x[0]===et)||["","Fuerza"])[1]+" "+(S.sessions.length+1),date:date,total:"",rpe:"",done:false,type:et||"fuerza",ex:[newEx()]};S.sessions.unshift(s);S.cur=s.id;openEx.add(s.ex[0].id)}
const fld=(l,f,v,ph,t)=>`<div><label>${l}</label><input type="${t||"text"}" data-f="${f}" value="${esc(v)}" placeholder="${ph||""}"></div>`;

function exH(e,i,lb){if(!openEx.has(e.id))return `<div class="card ex-s${lb&&lb.length>1?" ss":""}" data-i="${i}" data-act="toggEx" data-id="${e.id}"><div class="row"><b>${lb||i+1}. ${esc(e.name||"Sin nombre")}</b><small>Abrir ›</small></div><small>${[e.series&&e.reps?e.series+"×"+e.reps:"",e.load?e.load+" kg":"",e.effVal?e.effType+" "+e.effVal:""].filter(Boolean).map(esc).join(" · ")||"Sin datos"}</small></div>`;
return `<div class="card${lb&&lb.length>1?" ss":""}" data-i="${i}"><div class="ex-top"><b>Ejercicio ${lb||i+1}</b><span><button class="x" data-act="toggEx" data-id="${e.id}">Cerrar</button><button class="x" data-act="delEx">Eliminar</button></span></div>
${i?`<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" data-f="ss" style="width:auto" ${e.ss?"checked":""}> Superserie con el ejercicio anterior</label>`:""}${fld("Ejercicio","name",e.name,"Sentadilla frontal")}${fld("Vídeo (enlace)","video",e.video,"https://youtube.com/…","url")}
${e.video?`<a class="v" target="_blank" rel="noopener" href="${esc(e.video)}">▶ Ver vídeo</a>`:""}
<label>Observaciones</label><textarea data-f="obs" placeholder="Técnica, claves, errores…">${esc(e.obs)}</textarea>
${fld("Material necesario","material",e.material,"Barra, discos, rack…")}
<div class="grid">${fld("Series","series",e.series,"4","number")}${fld("Repeticiones","reps",e.reps,"8")}${fld("Descanso","rest",e.rest,"90 s")}</div>
<div class="grid"><div><label>Tempo (x-x-x-x)</label><div class="tempo">${e.t.map((x,k)=>`<input data-t="${k}" value="${esc(x)}" placeholder="${["3","1","X","0"][k]}" maxlength="2">`).join("")}</div></div>${fld("Carga (kg)","load",e.load,"80","number")}<div></div></div>
<div class="eff"><div><label>Nivel de esfuerzo</label><select data-f="effType" style="width:100%">${["RPE","RIR","Zona cardíaca","Velocidad (%)","Cadencia (rpm)","Potencia (W)"].map(o=>`<option ${o===e.effType?"selected":""}>${o}</option>`).join("")}</select></div>${fld("Valor","effVal",e.effVal,"8 · 2 · Z3 · 75%")}</div></div>`}

function entH(){if(entV==="home")return homeT();const s=cur();
let h=`<div class="bar"><select id="sel">${S.sessions.map(x=>`<option value="${x.id}" ${x.id===S.cur?"selected":""}>${esc(x.date)} · ${esc(x.name)}</option>`).join("")}</select>${CLI()?"":'<button class="w" data-act="newS">+ Nueva sesión</button>'}<button data-act="home">‹ Mis entrenos</button>${CLI()?"":'<button data-act="delS">Eliminar</button>'}</div>`;
if(!s)return h+'<div class="empty">Aún no hay sesiones. Crea una o planifícala desde el calendario.</div>';
const st=stats(s);
return h+`<div class="card"><div class="head"><div><label>Sesión</label><input data-s="name" ${CLI()?"disabled":""} value="${esc(s.name)}"></div><div><label>Fecha</label><input type="date" data-s="date" ${CLI()?"disabled":""} value="${esc(s.date)}"></div><div><label>Tiempo total (min)</label><input type="number" data-s="total" ${CLI()&&!["padel","futbol"].includes(sty(s))?"disabled":""} value="${esc(s.total)}"></div><div><label>RPE sesión (1-10)</label><input type="number" min="1" max="10" data-s="rpe" value="${esc(s.rpe)}"></div></div>
${typeH(s)}<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" data-s="done" style="width:auto" ${s.done?"checked":""}> Sesión realizada</label>
<div class="sum"><span>Carga (sRPE): <b id="sl">${st.load}</b> UA</span><span>Volumen: <b id="vol">${Math.round(st.vol)}</b> kg</span><span>Ejercicios: <b>${s.ex.length}</b></span></div>
<small>Carga sRPE = minutos × RPE de sesión.</small></div>`+s.ex.map((e,i)=>CLI()?exC(e,i,gl(s)[i]):exH(e,i,gl(s)[i])).join("")+(CLI()?"":`<button class="w" data-act="addEx" style="width:100%">+ Añadir ejercicio</button>`)}

function calH(){const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
let c="LMXJVSD".split("").map(d=>`<div class="wd">${d}</div>`).join("");for(let i=0;i<off;i++)c+="<div></div>";
for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),ss=S.sessions.filter(s=>s.date===k);
c+=`<div class="day ${k===today?"td":""} ${k===selDay?"sel":""}" data-act="selDay" data-v="${k}"><b>${d}</b>${ss.slice(0,2).map(s=>`<i class="${s.done?"dn":""}">${esc(s.name)}</i>`).join("")}${ss.length>2?`<i>+${ss.length-2}</i>`:""}</div>`}
const sd=S.sessions.filter(s=>s.date===selDay);
return `<div class="card"><div class="row"><button data-act="cPrev">‹</button><b style="text-transform:capitalize">${cm.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</b><button data-act="cNext">›</button></div><div class="cal" style="margin-top:10px">${c}</div>
<small>Relleno = realizada · borde = planificada</small></div>
<div class="card"><b>${new Date(selDay+"T00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</b>
${sd.map(s=>`<div class="row" style="margin-top:8px"><span>${s.done?"✅":"🗓️"} ${esc(s.name)} <small>(${stats(s).load} UA)</small></span><button data-act="openS" data-v="${s.id}">Abrir</button></div>`).join("")||"<div><small>Sin sesiones este día.</small></div>"}
${CLI()?"":`<button class="w" style="margin-top:10px;background:var(--red);color:#fff" data-act="planS">+ Planificar sesión este día</button>`}</div>`}

function items(){const dn=S.sessions.filter(s=>s.done),val=s=>{const t=stats(s);return t[metric]};
const sc=d=>{const r=S.rec[d];return r&&r.saved?r.ci.score:null};
if(per==="d")return[...Array(21)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-20+i);const k=ymd(x);return{d:k,l:k.slice(5),v:dn.filter(s=>s.date===k).reduce((a,s)=>a+val(s),0),rd:sc(k)}});
if(per==="s")return dn.sort((a,b)=>a.date<b.date?-1:1).slice(-16).map(s=>({l:s.date.slice(5),v:val(s),rd:sc(s.date)}));
const mon=d=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)};
const out=[],m=new Date(mon(today)+"T00:00");m.setDate(m.getDate()-77);
for(let i=0;i<12;i++){const k=ymd(m),rs=Object.keys(S.rec).filter(d=>mon(d)===k&&sc(d)!=null).map(sc);
out.push({l:k.slice(5),v:dn.filter(s=>mon(s.date)===k).reduce((a,s)=>a+val(s),0),rd:rs.length?rs.reduce((a,b)=>a+b)/rs.length:null});m.setDate(m.getDate()+7)}return out}
const dayT=it=>`<div class="card"><b>Carga interna diaria</b><table><tr><th>Día</th><th>Sesión</th><th>UA</th><th>Ready</th></tr>${it.slice(-7).reverse().map(i=>{const ss=S.sessions.filter(s=>s.done&&s.date===i.d);return `<tr><td>${i.l}</td><td>${ss.map(s=>esc(s.name)).join(", ")||"–"}</td><td>${Math.round(i.v)}</td><td>${i.rd==null?"–":Math.round(i.rd)}</td></tr>`}).join("")}</table><small>UA = minutos × RPE de la sesión. Ready = readiness del check-in de ese día (línea negra del gráfico).</small></div>`;
function carH(){const it=items(),W=640,H=220,P=26,mx=Math.max(1,...it.map(i=>i.v)),bw=(W-2*P)/it.length;
let g=it.map((i,k)=>{const h=(H-2*P)*i.v/mx,x=P+k*bw;return `<rect x="${x+4}" y="${H-P-h}" width="${bw-8}" height="${h}" fill="#7a0f1a" rx="3"/><text x="${x+bw/2}" y="${H-10}" font-size="10" text-anchor="middle" fill="#333">${i.l}</text>${i.v?`<text x="${x+bw/2}" y="${H-P-h-4}" font-size="10" text-anchor="middle" fill="#7a0f1a">${Math.round(i.v)}</text>`:""}`}).join("");
const pts=it.map((i,k)=>i.rd==null?null:[P+k*bw+bw/2,H-P-(H-2*P)*i.rd/100]).filter(Boolean);
if(pts.length)g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#0d0d0d" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0d0d0d"/>`).join("");
const tb=per==="w"?`<table><tr><th>Semana</th><th>Valor</th><th>vs. media previa</th><th>Readiness</th></tr>${it.map((i,k)=>{const p=it.slice(Math.max(0,k-4),k).filter(x=>x.v>0),a=p.length?p.reduce((s,x)=>s+x.v,0)/p.length:0,r=a&&i.v?(i.v/a).toFixed(2):"–";return `<tr><td>${i.l}</td><td>${Math.round(i.v)}</td><td>${r}${r>1.5?" ⚠️":""}</td><td>${i.rd==null?"–":Math.round(i.rd)}</td></tr>`}).join("")}</table>`:"";
return `<div class="card"><div class="bar"><select id="metric"><option value="load" ${metric==="load"?"selected":""}>Carga interna (sRPE)</option><option value="vol" ${metric==="vol"?"selected":""}>Volumen (kg)</option><option value="m" ${metric==="m"?"selected":""}>Minutos</option></select><select id="per"><option value="w" ${per==="w"?"selected":""}>Por semana</option><option value="d" ${per==="d"?"selected":""}>Por día</option><option value="s" ${per==="s"?"selected":""}>Por sesión</option></select></div>
<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg>
